intro:
  title: 'Forfait élèves et pilotes : forfait annuel de 2 490,00 €'
  body: |
    Le forfait pour l’année 2026/2027 est fixé à **2 490,00 €**. Le forfait permet de bénéficier d’un tarif préférentiel, avec une économie de 10,00 € sur le prix d’une heure de vol.

    Le montant du forfait est converti en heures de vol selon le tarif horaire de l’appareil utilisé. Chaque heure effectuée vient donc diminuer le crédit du forfait.

    <u>Exemples</u> :

    - Un pilote qui vole uniquement sur l’Océanair TC160 (165 €/h) dispose d’environ 15 heures de vol.
    - Un pilote qui vole uniquement sur le Piper PA28-180 (175 €/h) dispose d’environ 14 h 15.

    ### Au-delà du forfait

    Une fois le forfait entièrement consommé, le pilote peut continuer à voler en bénéficiant d’un tarif préférentiel.

    <u>À titre d’exemple</u> :

    - Océanair TC160 : 155 €/h (au lieu de 165 €/h)
    - Piper PA28-180 : 165 €/h (au lieu de 175 €/h)

    ### Forfait non consommé

    Le forfait annuel constitue un engagement. En conséquence, les heures de vol non utilisées au 31 décembre sont reportées à l’année suivante, la première année lorsque les pilotes reprennent un forfait.

    <u>Des exceptions sont toutefois prévues</u> :

    - en cas d’empêchement majeur (maladie, accident, déplacement professionnel de longue durée, etc.) ;
    - pour les élèves pilotes, dont les heures non consommées sont automatiquement reportées et ajoutées au forfait de l’année suivante.

    ### Pilotes sans forfait

    Les pilotes qui choisissent de ne pas souscrire au forfait annuel peuvent naturellement voler, mais les heures sont alors facturées au tarif hors forfait.

    <u>Par exemple</u> :

    - Océanair TC160 : 197 €/h (au lieu de 165 €/h avec forfait).

    Les tarifs des autres appareils sont consultables dans la grille tarifaire ci-dessous.

    ### Modalités de paiement

    Le forfait annuel peut être réglé en **une ou plusieurs échéances**.

    **Les tarifs pourront être révisés en fonction de l’évolution du coût du carburant.**
