name: CI

# Checks only: runs untrusted PR code (including from forks), so it has no secrets and a
# read-only token. Nothing is deployed from a PR; main deploys to staging (see deploy.yml).

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  checks:
    name: Lint, tests, build, SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type & content check
        run: npm run check
      - name: Unit tests
        run: npm test

      - name: Build (production flavour, for SEO checks)
        run: npm run build
        env:
          PUBLIC_SITE_ENV: production
      - name: SEO lint
        run: npm run seo:lint
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --root-dir "${{ github.workspace }}/dist/client" "dist/client/**/*.html"
          fail: true

      - name: End-to-end tests (local Workers runtime)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse (budgets in lighthouserc.json)
        run: npx --yes @lhci/cli@0.15.x autorun
